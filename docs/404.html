  <body>
    <div id="root"></div>
    <script>
      // Fallback detector if GitHub Pages is configured to serve uncompiled root directory
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
        window.addEventListener('error', function (e) {
          var isModuleOrTsxError = e.filename && (e.filename.includes('main.tsx') || e.message.includes('MIME') || e.message.includes('module'));
          if (isModuleOrTsxError || (!document.getElementById('root').hasChildNodes() && e.target && e.target.src && e.target.src.includes('main.tsx'))) {
            var targetPath = window.location.pathname.replace(/\/$/, '') + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(targetPath);
          }
        }, true);
      }
    </script>
